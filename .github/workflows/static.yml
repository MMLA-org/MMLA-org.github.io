# Deploy the MMLA-org.github.io repository root to GitHub Pages.
name: Deploy MMLA GitHub Pages

on:
  # Runs when the published site is updated.
  push:
    branches: ["main"]

  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

# Allow the workflow token to upload and deploy the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # A static site only needs one deployment job.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is served from the repository root.
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

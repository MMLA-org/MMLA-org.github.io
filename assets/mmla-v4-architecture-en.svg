<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">MMLAv4: Memory-Mediated Learning Architecture</title>
  <desc id="desc">MMLAv4 architecture, based on sections 2 and 3 and Figure 3 of arXiv:2606.28876v4. Five state layers have separate writers, lifetimes and rollback rules. Each causal attempt reads compatible, fixed versions of the policy and memory. Feedback can trigger a bounded policy update or an exact no-op while the same problem is being solved. After a segment ends, its events are processed in order. A neural model proposes content for a target slot, a trusted module assembles a complete row, and a controller selects a valid row or exact NULL using only available information. Each commit replaces one complete row; NULL changes nothing. Updated states are available only to later attempts. Outcomes from multiple continuations of the same prefix provide offline training targets. Architecture and training information flow shown here are based on sections 2–3 of v4.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#647168" stroke-width="1.6"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4168a0" stroke-width="1.6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#27634b" stroke-width="1.6"/></marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ad5c46" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:0;fill:#202722}
      .brand{font-size:36px;font-weight:750}.title{font-size:29px;font-weight:500}.subtitle{font-size:18px;fill:#647168}
      .layer-symbol{font-size:27px;font-weight:600}.layer-label{font-size:18px;font-weight:600}.layer-note{font-size:15px;fill:#647168}
      .section{font-size:17px;font-weight:700}.section-note{font-size:15px;fill:#647168}
      .node-title{font-size:21px;font-weight:600}.node-sub{font-size:17px;fill:#647168}.small-title{font-size:18px;font-weight:600}.small-sub{font-size:15px;fill:#647168}.math{font-size:22px;font-weight:500}
      .blue{fill:#4168a0}.green{fill:#27634b}.coral{fill:#ad5c46}.muted{fill:#647168}.sub{font-size:65%;baseline-shift:sub}
      .wire{fill:none;stroke:#647168;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}
      .policy-wire{fill:none;stroke:#4168a0;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow-blue)}
      .memory-wire{fill:none;stroke:#27634b;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow-green)}
      .teacher-wire{fill:none;stroke:#ad5c46;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow-coral)}
      .box{fill:#fff;stroke:#d9dfda;stroke-width:1.3}.policy-box{fill:#f3f6fb;stroke:#b9c9de;stroke-width:1.3}.memory-box{fill:#f2f7f3;stroke:#b5ccbd;stroke-width:1.3}.teacher-box{fill:#fff;stroke:#ddbcaf;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#fff"/>
  <text x="56" y="60" class="brand">MMLAv4</text>
  <text x="274" y="59" class="title">Memory-Mediated Learning Architecture</text>
  <text x="56" y="94" class="subtitle">Predictive Dual-State Adaptation · Independent policy updates and memory writes</text>

  <g>
    <rect x="56" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="76" y="157" class="layer-symbol">h<tspan class="sub">t</tspan></text><text x="119" y="156" class="layer-label">Causal token state</text>
    <text x="76" y="191" class="layer-note">Token / attempt lifetime</text>
    <rect x="356" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="376" y="157" class="layer-symbol">B<tspan class="sub">n</tspan></text><text x="423" y="156" class="layer-label">Segment workspace</text>
    <text x="376" y="191" class="layer-note">Bounded; used after a segment ends</text>
    <rect x="656" y="122" width="286" height="96" rx="6" class="policy-box"/>
    <text x="676" y="157" class="layer-symbol blue">Φ<tspan class="sub">n</tspan></text><text x="729" y="156" class="layer-label">Policy carrier</text>
    <text x="676" y="191" class="layer-note">Bounded numerical adaptation</text>
    <rect x="956" y="122" width="286" height="96" rx="6" class="memory-box"/>
    <text x="976" y="157" class="layer-symbol green">M<tspan class="sub">n</tspan></text><text x="1032" y="156" class="layer-label">Authoritative memory</text>
    <text x="976" y="191" class="layer-note">Bounded, complete typed rows</text>
    <rect x="1256" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="1276" y="157" class="layer-symbol">θ</text><text x="1316" y="156" class="layer-label">Slow base parameters</text>
    <text x="1276" y="191" class="layer-note">Offline / pretraining lifecycle</text>
  </g>

  <rect x="0" y="242" width="1600" height="266" fill="#f6f7f5"/>
  <text x="56" y="269" class="section">01 / CAUSAL DEPLOYMENT</text>
  <text x="1542" y="269" text-anchor="end" class="section-note">Every decision uses information already available</text>

  <path d="M332 339 H590" class="wire"/>
  <path d="M1050 339 H1150" class="wire"/>
  <path d="M820 414 V386" class="wire"/>
  <path d="M1346 386 V402 H28 V828 H56" class="wire" stroke-opacity=".55"/>
  <path d="M28 614 H56" class="wire" stroke-opacity=".55"/>
  <path d="M1544 828 H1572 V438 H1050" class="memory-wire"/>
  <path d="M1340 614 H1480 V466 H1050" class="policy-wire"/>

  <rect x="56" y="292" width="276" height="94" rx="6" class="box"/>
  <text x="80" y="329" class="node-title">Observed tokens</text>
  <text x="80" y="359" class="node-sub">Causal state h<tspan class="sub">t</tspan></text>
  <rect x="590" y="292" width="460" height="94" rx="6" fill="#202722"/>
  <text x="616" y="329" class="node-title" style="fill:#fff">Causal backbone · θ</text>
  <text x="616" y="359" class="node-sub" style="fill:#d8e1d9">Local / recurrent computation + bounded reads</text>
  <rect x="1150" y="292" width="392" height="94" rx="6" class="box"/>
  <text x="1176" y="329" class="node-title">Next-token prediction</text>
  <text x="1176" y="359" class="node-sub">Attempts, observations and feedback</text>

  <text x="56" y="445" class="node-title">Read compatible policy and memory versions</text>
  <text x="56" y="476" class="node-sub">Each state retains its own write permissions.</text>
  <rect x="590" y="414" width="460" height="76" rx="6" class="box"/>
  <text x="614" y="444" class="node-title">Pinned pair (vΦ, vM)</text>
  <text x="614" y="472" class="small-sub">The next attempt reads compatible versions of both states</text>
  <text x="1080" y="428" class="small-sub green">M<tspan class="sub">n</tspan>: publish only after the final ordered event</text>
  <text x="1080" y="490" class="small-sub blue">Φ<tspan class="sub">n</tspan>: updated policy is available to later attempts</text>

  <text x="56" y="544" class="section blue">02 / POLICY ADAPTATION</text>
  <text x="395" y="544" class="section-note">While solving the same problem</text>
  <path d="M342 614 H395" class="policy-wire"/>
  <path d="M945 614 H995" class="policy-wire"/>
  <rect x="56" y="572" width="286" height="84" rx="6" class="box"/>
  <text x="80" y="607" class="node-title">Received feedback</text>
  <text x="80" y="636" class="node-sub">Record the observed event ID</text>
  <rect x="395" y="572" width="550" height="84" rx="6" class="policy-box"/>
  <text x="419" y="607" class="node-title">Authorized bounded update or exact no-op</text>
  <text x="419" y="636" class="node-sub">Independent writer and receipt; a no-op leaves all state intact</text>
  <rect x="995" y="572" width="345" height="84" rx="6" class="policy-box"/>
  <text x="1019" y="607" class="node-title blue">Numerical carrier Φ<tspan class="sub">n</tspan></text>
  <text x="1019" y="636" class="node-sub">Own optimizer, reset and rollback</text>

  <rect x="0" y="682" width="1600" height="280" fill="#f6f7f5"/>
  <path d="M28 682 V828 H56" class="wire" stroke-opacity=".55"/>
  <path d="M1544 828 H1572 V682" fill="none" stroke="#27634b" stroke-width="1.8"/>
  <text x="56" y="715" class="section green">03 / AUTHORITATIVE MEMORY</text>
  <text x="442" y="715" class="section-note">Process completed events in order; commit at most one row per event</text>
  <text x="56" y="750" class="small-sub">After the segment ends</text>
  <text x="442" y="750" class="small-sub green">Event j reads the preceding memory state M<tspan class="sub">n,j-1</tspan></text>
  <path d="M221 828 H249" class="memory-wire"/>
  <path d="M414 828 H442" class="memory-wire"/>
  <path d="M647 828 H675" class="memory-wire"/>
  <path d="M880 828 H908" class="memory-wire"/>
  <path d="M1078 828 H1106" class="memory-wire"/>
  <path d="M1276 828 H1304" class="memory-wire"/>
  <path d="M1424 886 V936 H544 V886" class="memory-wire"/>
  <text x="756" y="922" class="small-sub green">The next event reads the memory state produced by this event</text>

  <rect x="56" y="770" width="165" height="116" rx="6" class="box"/>
  <text x="76" y="801" class="small-title">Workspace B<tspan class="sub">n</tspan></text>
  <text x="76" y="831" class="small-sub">Bounded summary</text>
  <text x="76" y="856" class="small-sub">of observed content</text>
  <rect x="249" y="770" width="165" height="116" rx="6" class="box"/>
  <text x="269" y="801" class="small-title">Ordered events</text>
  <text x="269" y="831" class="math">e<tspan class="sub">n,1</tspan> … e<tspan class="sub">n,K</tspan></text>
  <text x="269" y="856" class="small-sub">K ≤ Kmax</text>
  <rect x="442" y="770" width="205" height="116" rx="6" class="memory-box"/>
  <text x="462" y="801" class="small-title">Propose content</text>
  <text x="462" y="831" class="small-sub">Neural model; target slot</text>
  <text x="462" y="857" class="math green">c<tspan class="sub">n,j,a</tspan></text>
  <rect x="675" y="770" width="205" height="116" rx="6" class="memory-box"/>
  <text x="695" y="801" class="small-title">Assemble full row</text>
  <text x="695" y="831" class="small-sub">By a trusted module</text>
  <text x="695" y="856" class="small-sub">Identity / ACL / version</text>
  <rect x="908" y="770" width="170" height="116" rx="6" class="memory-box"/>
  <text x="928" y="801" class="small-title">Validation</text>
  <text x="928" y="831" class="small-sub">Schema + security</text>
  <text x="928" y="856" class="small-sub">Invalid → NULL</text>
  <rect x="1106" y="770" width="170" height="116" rx="6" class="memory-box"/>
  <text x="1126" y="801" class="small-title">Causal controller</text>
  <text x="1126" y="831" class="small-sub">No future information</text>
  <text x="1126" y="856" class="small-sub">Slot or exact NULL</text>
  <rect x="1304" y="770" width="240" height="116" rx="6" fill="#27634b"/>
  <text x="1324" y="801" class="small-title" style="fill:#fff">Atomic commit · M<tspan class="sub">n,j</tspan></text>
  <text x="1324" y="831" class="small-sub" style="fill:#e0ede4">One complete row or no change</text>
  <text x="1324" y="856" class="small-sub" style="fill:#e0ede4">Own ledger / reset / rollback</text>

  <rect x="0" y="982" width="1600" height="160" fill="#fbf5f1"/>
  <path d="M56 982 H1544" stroke="#c9927d" stroke-width="1.3" stroke-dasharray="7 6"/>
  <text x="56" y="1015" class="section coral">04 / OFFLINE VALUE MODEL TRAINING</text>
  <text x="1542" y="1015" text-anchor="end" class="section-note">Future outcomes are used only during training</text>
  <path d="M366 1082 H416" class="teacher-wire"/>
  <path d="M758 1082 H808" class="teacher-wire"/>
  <path d="M1150 1082 H1200" class="teacher-wire"/>
  <rect x="56" y="1040" width="310" height="84" rx="6" class="teacher-box"/>
  <text x="78" y="1074" class="node-title">Outcomes from one prefix</text>
  <text x="78" y="1102" class="node-sub">Group multiple realized continuations</text>
  <rect x="416" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="438" y="1074" class="node-title">Replay each candidate action</text>
  <text x="438" y="1102" class="node-sub">Compare feasible actions for each event</text>
  <rect x="808" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="830" y="1074" class="node-title">Expected-risk oracle</text>
  <text x="830" y="1102" class="node-sub coral">Expected risk over same-prefix futures</text>
  <rect x="1200" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="1222" y="1074" class="node-title">Train causal value model Qψ</text>
  <text x="1222" y="1102" class="node-sub">Predict action risk from causal history</text>

  <text x="56" y="1176" class="small-sub">Source: arXiv:2606.28876v4, §§ 2–3, Fig. 3</text>
  <text x="1542" y="1176" text-anchor="end" class="small-title">Architecture and training flow · based on v4 §§ 2–3</text>
</svg>

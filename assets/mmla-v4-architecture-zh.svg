<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">MMLAv4：记忆介导学习架构</title>
  <desc id="desc">MMLAv4 架构，依据 arXiv:2606.28876v4 第 2、3 节及图 3。五类状态分别规定写入权限、生命周期和回滚规则。每次推理读取兼容且固定版本的策略与记忆。在同一问题求解期间，反馈可触发有界策略更新或精确无操作。片段结束后，系统按顺序处理事件：神经模型根据目标槽位生成候选内容，可信模块组装完整记忆行，校验后由控制器选择槽位或精确 NULL。控制器只使用已经获得的信息。每次提交替换完整一行，NULL 不改变任何状态。新状态仅供后续推理读取。同一前缀下多个后续分支的结果只用于离线训练。图示架构与训练信息流，依据 v4 第 2–3 节。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#647168" stroke-width="1.6"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#4168a0" stroke-width="1.6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#27634b" stroke-width="1.6"/></marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ad5c46" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Inter,"Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;fill:#202722}
      .brand{font-size:36px;font-weight:750}.title{font-size:29px;font-weight:500}.subtitle{font-size:18px;fill:#647168}
      .layer-symbol{font-size:27px;font-weight:600}.layer-label{font-size:19px;font-weight:600}.layer-note{font-size:16px;fill:#647168}
      .section{font-size:18px;font-weight:700}.section-note{font-size:16px;fill:#647168}
      .node-title{font-size:22px;font-weight:600}.node-sub{font-size:18px;fill:#647168}.small-title{font-size:19px;font-weight:600}.small-sub{font-size:16px;fill:#647168}.math{font-size:23px;font-weight:500}
      .blue{fill:#4168a0}.green{fill:#27634b}.coral{fill:#ad5c46}.muted{fill:#647168}.sub{font-size:65%;baseline-shift:sub}
      .wire{fill:none;stroke:#647168;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}
      .policy-wire{fill:none;stroke:#4168a0;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow-blue)}
      .memory-wire{fill:none;stroke:#27634b;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow-green)}
      .teacher-wire{fill:none;stroke:#ad5c46;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow-coral)}
      .box{fill:#fff;stroke:#d9dfda;stroke-width:1.3}.policy-box{fill:#f3f6fb;stroke:#b9c9de;stroke-width:1.3}.memory-box{fill:#f2f7f3;stroke:#b5ccbd;stroke-width:1.3}.teacher-box{fill:#fff;stroke:#ddbcaf;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#fff"/>
  <text x="56" y="60" class="brand">MMLAv4</text>
  <text x="274" y="59" class="title">记忆介导学习架构</text>
  <text x="56" y="94" class="subtitle">预测式双状态适应 PDSA · 策略更新与记忆写入相互独立</text>

  <g>
    <rect x="56" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="76" y="157" class="layer-symbol">h<tspan class="sub">t</tspan></text><text x="119" y="156" class="layer-label">因果 token 状态</text>
    <text x="76" y="191" class="layer-note">token / 单次尝试的生命周期</text>
    <rect x="356" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="376" y="157" class="layer-symbol">B<tspan class="sub">n</tspan></text><text x="423" y="156" class="layer-label">片段工作区</text>
    <text x="376" y="191" class="layer-note">有界；仅在片段结束后可用</text>
    <rect x="656" y="122" width="286" height="96" rx="6" class="policy-box"/>
    <text x="676" y="157" class="layer-symbol blue">Φ<tspan class="sub">n</tspan></text><text x="729" y="156" class="layer-label">数值策略载体</text>
    <text x="676" y="191" class="layer-note">有界；在问题求解期间更新</text>
    <rect x="956" y="122" width="286" height="96" rx="6" class="memory-box"/>
    <text x="976" y="157" class="layer-symbol green">M<tspan class="sub">n</tspan></text><text x="1032" y="156" class="layer-label">权威记忆</text>
    <text x="976" y="191" class="layer-note">容量有界；存储完整类型化记录</text>
    <rect x="1256" y="122" width="286" height="96" rx="6" class="box"/>
    <text x="1276" y="157" class="layer-symbol">θ</text><text x="1316" y="156" class="layer-label">慢速基础参数</text>
    <text x="1276" y="191" class="layer-note">离线训练 / 预训练生命周期</text>
  </g>

  <rect x="0" y="242" width="1600" height="266" fill="#f6f7f5"/>
  <text x="56" y="269" class="section">01 / 因果部署路径</text>
  <text x="1542" y="269" text-anchor="end" class="section-note">所有决策只使用当时已经获得的信息</text>

  <path d="M332 339 H590" class="wire"/>
  <path d="M1050 339 H1150" class="wire"/>
  <path d="M820 414 V386" class="wire"/>
  <path d="M1346 386 V402 H28 V828 H56" class="wire" stroke-opacity=".55"/>
  <path d="M28 614 H56" class="wire" stroke-opacity=".55"/>
  <path d="M1544 828 H1572 V438 H1050" class="memory-wire"/>
  <path d="M1340 614 H1480 V466 H1050" class="policy-wire"/>

  <rect x="56" y="292" width="276" height="94" rx="6" class="box"/>
  <text x="80" y="329" class="node-title">已观察的 token</text>
  <text x="80" y="359" class="node-sub">因果状态 h<tspan class="sub">t</tspan></text>
  <rect x="590" y="292" width="460" height="94" rx="6" fill="#202722"/>
  <text x="616" y="329" class="node-title" style="fill:#fff">因果主干 · θ</text>
  <text x="616" y="359" class="node-sub" style="fill:#d8e1d9">局部 / 循环计算 + 有界状态读取</text>
  <rect x="1150" y="292" width="392" height="94" rx="6" class="box"/>
  <text x="1176" y="329" class="node-title">下一 token 预测</text>
  <text x="1176" y="359" class="node-sub">推理尝试、观察与反馈</text>

  <text x="56" y="445" class="node-title">读取兼容的策略与记忆版本</text>
  <text x="56" y="476" class="node-sub">策略与记忆各自管理写入权限。</text>
  <rect x="590" y="414" width="460" height="76" rx="6" class="box"/>
  <text x="614" y="444" class="node-title">固定版本对 (vΦ, vM)</text>
  <text x="614" y="472" class="small-sub">后续推理使用兼容的策略版本与记忆版本</text>
  <text x="1080" y="428" class="small-sub green">M<tspan class="sub">n</tspan>：所有事件处理完毕后，供后续推理读取</text>
  <text x="1080" y="490" class="small-sub blue">Φ<tspan class="sub">n</tspan>：更新后的策略供后续尝试读取</text>

  <text x="56" y="544" class="section blue">02 / 策略适应路径</text>
  <text x="395" y="544" class="section-note">在同一问题求解期间</text>
  <path d="M342 614 H395" class="policy-wire"/>
  <path d="M945 614 H995" class="policy-wire"/>
  <rect x="56" y="572" width="286" height="84" rx="6" class="box"/>
  <text x="80" y="607" class="node-title">接收反馈</text>
  <text x="80" y="636" class="node-sub">记录已完成观察的事件编号</text>
  <rect x="395" y="572" width="550" height="84" rx="6" class="policy-box"/>
  <text x="419" y="607" class="node-title">授权的有界更新，或保持状态不变</text>
  <text x="419" y="636" class="node-sub">策略更新单独记录回执；无操作不改变任何状态</text>
  <rect x="995" y="572" width="345" height="84" rx="6" class="policy-box"/>
  <text x="1019" y="607" class="node-title blue">数值策略载体 Φ<tspan class="sub">n</tspan></text>
  <text x="1019" y="636" class="node-sub">独立的优化器、重置与回滚域</text>

  <rect x="0" y="682" width="1600" height="280" fill="#f6f7f5"/>
  <path d="M28 682 V828 H56" class="wire" stroke-opacity=".55"/>
  <path d="M1544 828 H1572 V682" fill="none" stroke="#27634b" stroke-width="1.8"/>
  <text x="56" y="715" class="section green">03 / 权威记忆路径</text>
  <text x="442" y="715" class="section-note">片段结束后按顺序处理事件；每个事件最多提交一行</text>
  <text x="56" y="750" class="small-sub">片段结束后</text>
  <text x="442" y="750" class="small-sub green">事件 j 读取前一步的记忆状态 M<tspan class="sub">n,j-1</tspan></text>
  <path d="M221 828 H249" class="memory-wire"/>
  <path d="M414 828 H442" class="memory-wire"/>
  <path d="M647 828 H675" class="memory-wire"/>
  <path d="M880 828 H908" class="memory-wire"/>
  <path d="M1078 828 H1106" class="memory-wire"/>
  <path d="M1276 828 H1304" class="memory-wire"/>
  <path d="M1424 886 V936 H544 V886" class="memory-wire"/>
  <text x="756" y="922" class="small-sub green">下一个事件读取本次处理后的记忆状态</text>

  <rect x="56" y="770" width="165" height="116" rx="6" class="box"/>
  <text x="76" y="801" class="small-title">片段工作区 B<tspan class="sub">n</tspan></text>
  <text x="76" y="831" class="small-sub">对已观察内容</text>
  <text x="76" y="856" class="small-sub">形成有界摘要</text>
  <rect x="249" y="770" width="165" height="116" rx="6" class="box"/>
  <text x="269" y="801" class="small-title">按顺序提取事件</text>
  <text x="269" y="831" class="math">e<tspan class="sub">n,1</tspan> … e<tspan class="sub">n,K</tspan></text>
  <text x="269" y="856" class="small-sub">K ≤ Kmax</text>
  <rect x="442" y="770" width="205" height="116" rx="6" class="memory-box"/>
  <text x="462" y="801" class="small-title">生成候选内容</text>
  <text x="462" y="831" class="small-sub">依据目标槽位生成</text>
  <text x="462" y="857" class="math green">c<tspan class="sub">n,j,a</tspan></text>
  <rect x="675" y="770" width="205" height="116" rx="6" class="memory-box"/>
  <text x="695" y="801" class="small-title">组装完整记忆行</text>
  <text x="695" y="831" class="small-sub">由可信模块组装</text>
  <text x="695" y="856" class="small-sub">身份 / 权限 / 版本</text>
  <rect x="908" y="770" width="170" height="116" rx="6" class="memory-box"/>
  <text x="928" y="801" class="small-title">校验</text>
  <text x="928" y="831" class="small-sub">结构与安全检查</text>
  <text x="928" y="856" class="small-sub">失败 → NULL</text>
  <rect x="1106" y="770" width="170" height="116" rx="6" class="memory-box"/>
  <text x="1126" y="801" class="small-title">因果控制器</text>
  <text x="1126" y="831" class="small-sub">不使用未来信息</text>
  <text x="1126" y="856" class="small-sub">选槽位或 NULL</text>
  <rect x="1304" y="770" width="240" height="116" rx="6" fill="#27634b"/>
  <text x="1324" y="801" class="small-title" style="fill:#fff">原子提交 · M<tspan class="sub">n,j</tspan></text>
  <text x="1324" y="831" class="small-sub" style="fill:#e0ede4">写入完整一行，或完全不变</text>
  <text x="1324" y="856" class="small-sub" style="fill:#e0ede4">独立的账本、重置与回滚域</text>

  <rect x="0" y="982" width="1600" height="160" fill="#fbf5f1"/>
  <path d="M56 982 H1544" stroke="#c9927d" stroke-width="1.3" stroke-dasharray="7 6"/>
  <text x="56" y="1015" class="section coral">04 / 离线价值模型训练</text>
  <text x="1542" y="1015" text-anchor="end" class="section-note">后续结果仅用于训练，不作为部署时的输入</text>
  <path d="M366 1082 H416" class="teacher-wire"/>
  <path d="M758 1082 H808" class="teacher-wire"/>
  <path d="M1150 1082 H1200" class="teacher-wire"/>
  <rect x="56" y="1040" width="310" height="84" rx="6" class="teacher-box"/>
  <text x="78" y="1074" class="node-title">同一前缀的后续结果</text>
  <text x="78" y="1102" class="node-sub">相同因果前缀下的多个后续分支</text>
  <rect x="416" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="438" y="1074" class="node-title">按候选动作重放</text>
  <text x="438" y="1102" class="node-sub">逐事件比较已注册的可行动作</text>
  <rect x="808" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="830" y="1074" class="node-title">期望风险 oracle</text>
  <text x="830" y="1102" class="node-sub coral">同前缀分支的期望风险</text>
  <rect x="1200" y="1040" width="342" height="84" rx="6" class="teacher-box"/>
  <text x="1222" y="1074" class="node-title">训练因果价值模型 Qψ</text>
  <text x="1222" y="1102" class="node-sub">仅用因果历史预测动作风险</text>

  <text x="56" y="1176" class="small-sub">依据 arXiv:2606.28876v4 第 2–3 节及图 3</text>
  <text x="1542" y="1176" text-anchor="end" class="small-title">架构与训练信息流 · 依据 v4 第 2–3 节</text>
</svg>
